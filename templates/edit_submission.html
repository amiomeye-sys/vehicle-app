<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Submission</title>
    <style>
        body { background-color: #0d1527; color: #fff; font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; background: #131d31; padding: 20px; border-radius: 8px; border: 1px solid #25334d; margin: auto; }
        h3 { color: #38bdf8; margin-bottom: 15px; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        input { padding: 8px; border-radius: 4px; border: 1px solid #25334d; background: #0d1527; color: #fff; }
        .btn-group { margin-top: 20px; display: flex; gap: 10px; }
        .btn { padding: 8px 16px; border-radius: 4px; font-weight: bold; border: none; cursor: pointer; text-decoration: none; }
        .btn-save { background: #38bdf8; color: #000; }
        .btn-back { background: #475569; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h3>✏️ Edit Submission #{{ item.id }}</h3>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>Owner Name:</label>
                <input type="text" name="owner_name" value="{{ item.owner_name }}">
            </div>
            <div class="form-group">
                <label>Owner Father's Name:</label>
                <input type="text" name="owner_father" value="{{ item.owner_father }}">
            </div>
            <div class="form-group">
                <label>Owner Address:</label>
                <input type="text" name="owner_address" value="{{ item.owner_address }}">
            </div>
            <div class="form-group">
                <label>Gari Number:</label>
                <input type="text" name="gari_number" value="{{ item.gari_number }}">
            </div>
            <div class="form-group">
                <label>Engine No:</label>
                <input type="text" name="engine_no" value="{{ item.engine_no }}">
            </div>
            <div class="form-group">
                <label>Chassis No:</label>
                <input type="text" name="chassis_no" value="{{ item.chassis_no }}">
            </div>
            <div class="form-group">
                <label>Driver Name:</label>
                <input type="text" name="driver_name" value="{{ item.driver_name }}">
            </div>
            <div class="form-group">
                <label>Driver Father's Name:</label>
                <input type="text" name="driver_father" value="{{ item.driver_father }}">
            </div>
            <div class="form-group">
                <label>Driver Address:</label>
                <input type="text" name="driver_address" value="{{ item.driver_address }}">
            </div>
            <div class="form-group">
                <label>License No:</label>
                <input type="text" name="license_no" value="{{ item.license_no }}">
            </div>
            <div class="form-group">
                <label>Authority Date:</label>
                <input type="date" name="date" value="{{ formatted_date }}">
            </div>
            <div class="form-group">
                <label>Update Driver Photo:</label>
                <input type="file" name="driver_photo">
            </div>
            <div class="form-group" style="flex-direction: row; align-items: center; gap: 8px;">
                <input type="checkbox" name="remove_photo" value="1" id="remove_photo" style="width: auto;">
                <label for="remove_photo" style="color: #ef4444; cursor: pointer;">Remove existing photo</label>
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-save">💾 Save Changes</button>
                <a href="/admin" class="btn btn-back">cancel</a>
            </div>
        </form>
    </div>
</body>
</html>
