<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details Entry</title>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; padding: 20px; }
        .container { max-width: 900px; margin: auto; background: #1e293b; padding: 25px; border-radius: 12px; border: 1px solid #38bdf8; display: flex; gap: 20px; flex-wrap: wrap; }
        h2 { color: #38bdf8; text-align: center; width: 100%; }
        .form-fields { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-group { margin-bottom: 8px; }
        .full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 4px; font-weight: bold; color: #cbd5e1; font-size: 14px; }
        input[type="text"], input[type="file"] { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: #fff; box-sizing: border-box; }
        input[type="text"] { text-transform: uppercase; }
        .photo-section { width: 220px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; border: 1px dashed #38bdf8; padding: 15px; border-radius: 8px; background: #0f172a; }
        .photo-preview { width: 140px; height: 180px; border: 1px solid #334155; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; color: #94a3b8; text-align: center; font-size: 12px; background: #1e293b; overflow: hidden; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        button { width: 100%; padding: 12px; background: #10b981; border: none; color: white; font-weight: bold; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 15px; grid-column: span 2; }
        .success-box { background: #065f46; color: #34d399; padding: 15px; border-radius: 8px; text-align: center; margin-bottom: 20px; width: 100%; }
    </style>
</head>
<body>
    <div class="container">
        <h2>✨ Vehicle Authorization Form ✨</h2>
        {% if success %}
            <div class="success-box">✅ Details Submitted Successfully! You can close this page.</div>
        {% endif %}
        <form action="/form" method="POST" enctype="multipart/form-data" style="display: flex; width: 100%; gap: 20px; flex-wrap: wrap;">
            <div class="form-fields">
                <div class="form-group"><label>Owner Name:</label><input type="text" name="owner_name" required></div>
                <div class="form-group"><label>Owner Father Name:</label><input type="text" name="owner_father" required></div>
                <div class="form-group full-width"><label>Owner Address:</label><input type="text" name="owner_address" required></div>
                <div class="form-group"><label>Gari Number:</label><input type="text" name="gari_number" required></div>
                <div class="form-group"><label>Engine No:</label><input type="text" name="engine_no" required></div>
                <div class="form-group"><label>Chassis Number:</label><input type="text" name="chassis_no" required></div>
                <div class="form-group"><label>Driver Name:</label><input type="text" name="driver_name" required></div>
                <div class="form-group"><label>Driver Father Name:</label><input type="text" name="driver_father" required></div>
                <div class="form-group full-width"><label>Driver Address:</label><input type="text" name="driver_address" required></div>
                <div class="form-group full-width"><label>License Number:</label><input type="text" name="license_no" required></div>
            </div>
            
            <div class="photo-section">
                <label>Driver Photo:</label>
                <div class="photo-preview" id="previewContainer">No Photo</div>
                <input type="file" name="driver_photo" accept="image/*" id="photoInput" onchange="previewImage(event)">
            </div>

            <button type="submit">Submit Details</button>
        </form>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('previewContainer');
                output.innerHTML = `<img src="${reader.result}">`;
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
