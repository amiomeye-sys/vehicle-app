<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vehicle Details Entry</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: #0d1527; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13px; padding: 10px; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { width: 100%; max-width: 980px; background: #131d31; padding: 12px 16px; border-radius: 8px; border: 1px solid #25334d; }
        h3 { color: #38bdf8; text-align: center; margin-bottom: 8px; font-size: 16px; font-weight: 600; }
        .success-box { background: #065f46; color: #34d399; padding: 6px 12px; border-radius: 4px; text-align: center; margin-bottom: 8px; font-size: 12px; }
        .form-layout { display: flex; gap: 12px; align-items: flex-start; }
        .fieldset-box { border: 1px solid #253eff; border-radius: 6px; padding: 10px 12px; background: #0a1120; }
        .fieldset-box legend { color: #38bdf8; font-size: 12px; font-weight: bold; padding: 0 6px; }
        .left-fields { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
        .form-group { display: flex; align-items: center; gap: 8px; }
        .full-width { grid-column: span 2; }
        label { width: 110px; font-weight: bold; color: #cbd5e1; font-size: 12px; white-space: nowrap; flex-shrink: 0; }
        input[type="text"] { flex: 1; width: 100%; padding: 5px 8px; border-radius: 4px; border: 1px solid #1e293b; background: #111a2e; color: #fff; font-size: 12px; text-transform: uppercase; }
        input[type="text"]:focus { outline: none; border-color: #38bdf8; }
        .photo-section { width: 190px; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
        .photo-preview { width: 110px; height: 135px; border: 1px dashed #38bdf8; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; color: #64748b; text-align: center; font-size: 11px; background: #111a2e; overflow: hidden; cursor: pointer; border-radius: 4px; }
        .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
        .btn-submit { width: auto; padding: 6px 20px; background: #10b981; border: none; color: white; font-weight: bold; border-radius: 4px; font-size: 13px; cursor: pointer; margin-top: 8px; }
        .btn-submit:hover { background: #059669; }
        .button-row { grid-column: span 2; display: flex; justify-content: center; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h3>✨ Vehicle Authorization Details ✨</h3>
        {% if success %}
            <div class="success-box">✅ Details Submitted Successfully! You can close this page.</div>
        {% endif %}
        <form action="/form" method="POST" enctype="multipart/form-data">
            <div class="form-layout">
                <fieldset class="fieldset-box left-fields">
                    <legend>Details Input</legend>
                    <div class="form-group"><label>Owner Name:</label><input type="text" name="owner_name" required></div>
                    <div class="form-group"><label>Father Name:</label><input type="text" name="owner_father" required></div>
                    <div class="form-group full-width"><label>Address:</label><input type="text" name="owner_address" required></div>
                    <div class="form-group"><label>Gari Number:</label><input type="text" name="gari_number" required></div>
                    <div class="form-group"><label>Engine No:</label><input type="text" name="engine_no" required></div>
                    <div class="form-group full-width"><label>Chassis Number:</label><input type="text" name="chassis_no" required></div>
                    <div class="form-group"><label>Driver Name:</label><input type="text" name="driver_name" required></div>
                    <div class="form-group"><label>Driver Father Name:</label><input type="text" name="driver_father" required></div>
                    <div class="form-group full-width"><label>Driver Address:</label><input type="text" name="driver_address" required></div>
                    <div class="form-group full-width"><label>License Number:</label><input type="text" name="license_no" required></div>
                    <div class="button-row">
                        <button type="submit" class="btn-submit">Submit Details</button>
                    </div>
                </fieldset>

                <fieldset class="fieldset-box photo-section">
                    <legend>Driver Photo</legend>
                    <div class="photo-preview" id="previewContainer" onclick="document.getElementById('photoInput').click();">
                        Click to Add Photo<br>(Auto White BG)
                    </div>
                    <input type="file" name="driver_photo" accept="image/*" id="photoInput" style="display: none;" onchange="previewImage(event)">
                </fieldset>
            </div>
        </form>
    </div>

    <script>
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function(){
                const output = document.getElementById('previewContainer');
                output.innerHTML = `<img src="${reader.result}">`;
            };
            if(event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>
</body>
</html>
